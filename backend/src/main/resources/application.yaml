spring:
  application:
    name: backend

  datasource:
    url: jdbc:postgresql://localhost:5432/bicap_db?options=-c%20TimeZone%3DUTC
    username: postgres
    password: 123456

  jpa:
    hibernate:
      ddl-auto: validate

    show-sql: true

    open-in-view: false

    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1

  jackson:
    time-zone: UTC

server:
  port: 8080

jwt:
  secret: 6G7jYz1rPq8LmN4xVb2Hs9KdEf5TwQaR6YuCi3ZoPxMvBn87
  expiration: 86400000

logging:
  level:
    org.springframework.security: INFO

app:
  upload:
    product-dir: uploads/product

